<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f62fe">
  <title>Сила — дневник тренировок</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#workouts" aria-label="Сила — главная">
      <span class="brand-mark" aria-hidden="true">С</span>
      <span>Сила</span>
    </a>
    <p id="today-label" class="today-label"></p>
    <button id="quick-add" class="button primary compact" type="button">+ Тренировка</button>
  </header>

  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Тренировочный дневник</p>
        <h1>Сильнее с каждой записью.</h1>
        <p class="hero-copy">Отслеживайте подходы, вес и прогресс. Все данные остаются в вашем браузере.</p>
      </div>
      <div class="hero-stat" aria-label="Сводка">
        <span id="workout-count">0</span>
        <small>тренировок сохранено</small>
      </div>
    </section>

    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" type="button" data-tab="workouts">Тренировки</button>
      <button class="tab" type="button" data-tab="add">Добавить</button>
      <button class="tab" type="button" data-tab="profile">Профиль</button>
    </nav>

    <section id="tab-workouts" class="panel tab-panel active">
      <div class="section-head">
        <div><p class="eyebrow">История</p><h2>Мои тренировки</h2></div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Дата, название или упражнение"></label>
      </div>
      <div id="workouts-list" class="workouts-list" aria-live="polite"></div>
    </section>

    <section id="tab-add" class="panel tab-panel">
      <div class="section-head"><div><p class="eyebrow">Новая запись</p><h2 id="form-title">Добавить тренировку</h2></div></div>
      <form id="workout-form">
        <div class="form-grid">
          <label>Название<input id="title" placeholder="Например, тяжёлый жим"></label>
          <label>Дата<input id="date" type="date" required></label>
        </div>
        <div class="exercise-heading"><h3>Упражнения</h3><button id="add-exercise" class="text-button" type="button">+ Добавить упражнение</button></div>
        <div id="exercises"></div>
        <label>Заметки<textarea id="notes" rows="3" placeholder="Самочувствие, техника, цели на следующий раз"></textarea></label>
        <label>Ссылка на видео<input id="video-url" type="url" placeholder="https://…"></label>
        <div id="form-message" class="message" role="status"></div>
        <div class="form-actions">
          <button id="cancel-edit" class="button secondary hidden" type="button">Отмена</button>
          <button class="button primary" type="submit">Сохранить тренировку</button>
        </div>
      </form>
    </section>

    <section id="tab-profile" class="panel tab-panel">
      <div class="section-head"><div><p class="eyebrow">Атлет</p><h2>Мой профиль</h2></div></div>
      <form id="profile-form">
        <div class="form-grid">
          <label>Имя<input id="profile-name" placeholder="Как к вам обращаться"></label>
          <label>Вес, кг<input id="profile-weight" type="number" min="1" step="0.1" placeholder="80"></label>
          <label>Рост, см<input id="profile-height" type="number" min="1" step="0.1" placeholder="180"></label>
          <label>Цель<select id="profile-goal"><option>Сила</option><option>Набор массы</option><option>Поддержание формы</option></select></label>
        </div>
        <label>О себе<textarea id="profile-info" rows="3" placeholder="Травмы, ограничения, соревновательные цели"></textarea></label>
        <div id="profile-message" class="message" role="status"></div>
        <button class="button primary" type="submit">Сохранить профиль</button>
      </form>
    </section>
  </main>

  <template id="exercise-template">
    <div class="exercise-row">
      <label class="exercise-name">Упражнение<input name="exercise-name" list="exercise-options" placeholder="Жим лёжа" required></label>
      <label>Подходы<input name="sets" type="number" min="1" inputmode="numeric" placeholder="4" required></label>
      <label>Повторы<input name="reps" type="number" min="1" inputmode="numeric" placeholder="6" required></label>
      <label>Вес, кг<input name="weight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="80"></label>
      <button class="remove-exercise" type="button" aria-label="Удалить упражнение">×</button>
    </div>
  </template>
  <datalist id="exercise-options"><option value="Приседания со штангой"><option value="Жим лёжа"><option value="Становая тяга"><option value="Жим стоя"><option value="Тяга штанги в наклоне"></datalist>
  <script type="module" src="./app.js"></script>
</body>
</html>
